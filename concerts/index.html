<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concert Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #fff;
  color: #111;
  line-height: 1.6;
  min-height: 100vh;
}

.header {
  padding: 2.5rem 0 1rem;
}
.header h1 {
  font-family: 'DM Sans', sans-serif;
  font-size: 2.5rem;
  font-weight: 700;
  color: #111;
  letter-spacing: -0.02em;
}
.header .back-link {
  display: inline-block;
  margin-top: 0.4rem;
  font-size: 0.8rem;
  font-weight: 500;
  color: #111;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.header .back-link:hover { color: #666; }

/* Legend */
.controls {
  padding: 0 0 0.75rem;
  display: flex;
  gap: 1.5rem;
  align-items: center;
  flex-wrap: wrap;
}
.legend {
  display: flex;
  gap: 1rem;
  align-items: center;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s;
  text-transform: lowercase;
}
.legend-item:hover { opacity: 0.7; }
.legend-item.dimmed { opacity: 0.3; }
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Chart area */
.chart-wrap {
  padding: 0;
  position: relative;
}
#chart {
  width: 100%;
  overflow: visible;
  display: block;
}

/* Year labels */
.year-label {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  fill: #bbb;
  text-anchor: middle;
}
.year-label-major {
  fill: #888;
  font-weight: 400;
}

/* Tooltip */
.tooltip {
  position: fixed;
  pointer-events: none;
  background: #fff;
  border: 1px solid #e0e0e0;
  box-shadow: 0 6px 24px rgba(0,0,0,0.10);
  padding: 0;
  font-size: 0.8rem;
  line-height: 1.5;
  z-index: 1000;
  width: 240px;
  opacity: 0;
  transition: opacity 0.15s ease;
  overflow: hidden;
}
.tooltip.visible { opacity: 1; }
.tooltip .tt-photo {
  width: 100%;
  height: 160px;
  object-fit: cover;
  display: block;
  background: #f5f5f5;
}
.tooltip .tt-body {
  padding: 10px 14px 12px;
}
.tooltip .tt-artist {
  font-weight: 700;
  font-size: 0.85rem;
  margin-bottom: 1px;
  color: #111;
}
.tooltip .tt-date {
  color: #666;
  font-size: 0.7rem;
  font-family: 'DM Mono', monospace;
}
.tooltip .tt-venue {
  color: #111;
  font-size: 0.75rem;
  margin-top: -1px;
}

/* Responsive */
@media (max-width: 768px) {
  .header { padding: 1.5rem 0 0.75rem; }
  .header h1 { font-size: 1.75rem; }
}
</style>
</head>
<body>

<div class="header" id="header">
  <h1>Concert timeline</h1>
</div>

<div class="controls" id="controls">
  <div class="legend" id="legend"></div>
</div>

<div class="chart-wrap">
  <svg id="chart"></svg>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
(function() {

  const GENRE_COLORS = {
    rock:    '#ff0064',
    blues:   '#0b1d3a',
    jazz:    '#6a00f4',
    soul:    '#1B998B',
    folk:    '#4BB3FD',
  };
  const UNKNOWN_COLOR = '#d1d4db';

  const RADIUS = 14;
  const COLLISION_PADDING = 4;
  const LEFT_PADDING = 60;  // px from left edge of page to first bubble area

  const tooltip = document.getElementById('tooltip');
  const svg = d3.select('#chart');

  let allEvents = [];
  let activeGenres = new Set();
  let simulation;

  function formatDate(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[m - 1]} ${d}, ${y}`;
  }

  function photoThumb(d) {
    if (d.photo) return `photos/${d.photo}-thumb.jpg`;
    return null;
  }

  async function init() {
    const resp = await fetch('events.json');
    allEvents = await resp.json();

    allEvents.forEach(d => {
      d.parsedDate = new Date(d.date + 'T12:00:00');
    });

    const genreOrder = ['rock', 'blues', 'jazz', 'folk', 'soul'];
    const genresInData = new Set(allEvents.map(d => d.genre).filter(Boolean));
    const genres = genreOrder.filter(g => genresInData.has(g));
    activeGenres = new Set(genres);
    buildLegend(genres);

    render();
  }

  function buildLegend(genres) {
    const container = document.getElementById('legend');
    genres.forEach(g => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.dataset.genre = g;
      item.innerHTML = `<span class="legend-dot" style="background:${GENRE_COLORS[g] || UNKNOWN_COLOR}"></span>${g}`;
      item.addEventListener('click', () => toggleGenre(g, item));
      container.appendChild(item);
    });
  }

  function toggleGenre(genre, el) {
    if (activeGenres.has(genre)) {
      activeGenres.delete(genre);
      el.classList.add('dimmed');
    } else {
      activeGenres.add(genre);
      el.classList.remove('dimmed');
    }
    updateVisibility();
  }

  function updateVisibility() {
    svg.selectAll('.bee-node')
      .transition().duration(300)
      .style('opacity', d => activeGenres.has(d.genre) ? 1 : 0.08);
  }

  function render() {
    const viewportWidth = window.innerWidth;
    const width = Math.max(viewportWidth * 2.5, 2800);
    const height = Math.max(500, Math.min(700, window.innerHeight * 0.6));
    const margin = { top: 40, right: 60, bottom: 40, left: LEFT_PADDING };

    // Align header and controls with the left margin
    document.getElementById('header').style.paddingLeft = margin.left + 'px';
    document.getElementById('controls').style.paddingLeft = margin.left + 'px';

    svg.attr('width', width).attr('height', height);
    document.querySelector('.chart-wrap').style.minWidth = width + 'px';
    svg.selectAll('*').remove();

    // Time scale — align first year line with left margin
    const dateExtent = d3.extent(allEvents, d => d.parsedDate);
    const startYear = new Date(dateExtent[0].getFullYear(), 0, 1);
    const endDate = d3.timeMonth.offset(dateExtent[1], 6);
    const xScale = d3.scaleTime()
      .domain([startYear, endDate])
      .range([margin.left, width - margin.right]);

    // Generate year ticks
    const firstYear = startYear.getFullYear();
    const endYear = dateExtent[1].getFullYear() + 1;
    const yearDates = [];
    for (let y = firstYear; y <= endYear; y++) {
      yearDates.push(new Date(y, 0, 1));
    }

    // Draw vertical year lines
    const linesGroup = svg.append('g');

    yearDates.forEach(d => {
      const x = xScale(d);
      const year = d.getFullYear();
      const isMajor = year % 5 === 0;

      linesGroup.append('line')
        .attr('x1', x)
        .attr('x2', x)
        .attr('y1', margin.top - 10)
        .attr('y2', height - margin.bottom + 10)
        .attr('stroke', isMajor ? '#ddd' : '#f0f0f0')
        .attr('stroke-width', isMajor ? 1 : 0.5);

      // Year labels at bottom
      if (isMajor || (endYear - startYear) < 20) {
        linesGroup.append('text')
          .attr('x', x)
          .attr('y', height - margin.bottom + 28)
          .attr('class', `year-label ${isMajor ? 'year-label-major' : ''}`)
          .text(year);
      }
    });

    // Initialize node positions
    const nodes = allEvents.map((d, i) => ({
      ...d,
      index: i,
      x: xScale(d.parsedDate),
      y: height / 2,
      targetX: xScale(d.parsedDate)
    }));

    // Create node groups
    const nodeGroups = svg.append('g')
      .selectAll('g')
      .data(nodes)
      .enter().append('g')
      .attr('class', 'bee-node')
      .style('cursor', 'pointer');

    // Solid colored circles
    nodeGroups.append('circle')
      .attr('r', RADIUS)
      .attr('fill', d => GENRE_COLORS[d.genre] || UNKNOWN_COLOR)
      .attr('stroke', '#fff')
      .attr('stroke-width', 1.5)
      .attr('opacity', 0.88);

    // Hover interactions
    nodeGroups
      .on('mouseenter', function(event, d) {
        d3.select(this).select('circle')
          .transition().duration(150)
          .attr('r', RADIUS + 3)
          .attr('stroke-width', 2.5)
          .attr('opacity', 1);

        d3.select(this).raise();

        const photoSrc = photoThumb(d);
        const photoHtml = photoSrc
          ? `<img class="tt-photo" src="${photoSrc}" alt="" onerror="this.style.display='none'">`
          : '';

        tooltip.innerHTML = `
          ${photoHtml}
          <div class="tt-body">
            <div class="tt-artist">${d.artist}</div>
            <div class="tt-venue">${d.venue}, ${d.city}</div>
            <div class="tt-date">${formatDate(d.date)}</div>
          </div>
        `;
        tooltip.classList.add('visible');
      })
      .on('mousemove', function(event) {
        let tx = event.clientX + 16;
        let ty = event.clientY - 16;
        // Keep tooltip on screen
        const rect = tooltip.getBoundingClientRect();
        if (tx + 240 > window.innerWidth) tx = event.clientX - 256;
        if (ty + rect.height > window.innerHeight) ty = event.clientY - rect.height - 8;
        if (ty < 8) ty = 8;
        tooltip.style.left = tx + 'px';
        tooltip.style.top = ty + 'px';
      })
      .on('mouseleave', function() {
        d3.select(this).select('circle')
          .transition().duration(150)
          .attr('r', RADIUS)
          .attr('stroke-width', 1.5)
          .attr('opacity', 0.88);
        tooltip.classList.remove('visible');
      });

    // Force simulation
    const centerY = margin.top + (height - margin.top - margin.bottom) / 2;

    simulation = d3.forceSimulation(nodes)
      .force('x', d3.forceX(d => d.targetX).strength(1))
      .force('y', d3.forceY(centerY).strength(0.07))
      .force('collide', d3.forceCollide(RADIUS + COLLISION_PADDING).strength(0.8))
      .alphaDecay(0.02)
      .on('tick', () => {
        nodeGroups.attr('transform', d => {
          d.y = Math.max(margin.top + RADIUS, Math.min(height - margin.bottom - RADIUS, d.y));
          return `translate(${d.x}, ${d.y})`;
        });
      });
  }

  function debounce(fn, ms) {
    let t;
    return function(...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), ms); };
  }

  init();

})();
</script>
</body>
</html>
