<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concert Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #fff;
  color: #111;
  line-height: 1.6;
  min-height: 100vh;
}

.fixed-top {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  background: #fff;
  z-index: 100;
}
.header {
  padding: 2.5rem 0 1rem;
}
.header h1 {
  font-family: 'DM Sans', sans-serif;
  font-size: 2.5rem;
  font-weight: 700;
  color: #111;
  letter-spacing: -0.02em;
}
.header .back-link {
  display: inline-block;
  margin-top: 0.4rem;
  font-size: 0.8rem;
  font-weight: 500;
  color: #111;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.header .back-link:hover { color: #666; }

/* Legend */
.controls {
  padding: 0 0 0.75rem;
  display: flex;
  gap: 1.5rem;
  align-items: center;
  flex-wrap: wrap;
}
.legend {
  display: flex;
  gap: 1rem;
  align-items: center;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s;
  text-transform: lowercase;
}
.legend-item:hover { opacity: 0.7; }
.legend-item.dimmed { opacity: 0.3; }
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Chart area */
.chart-wrap {
  padding: 0;
  position: relative;
}
#chart {
  width: 100%;
  overflow: visible;
  display: block;
}

/* Year labels */
.year-label {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  fill: #bbb;
  text-anchor: middle;
}
.year-label-major {
  fill: #888;
  font-weight: 400;
}

/* Location bar */
.location-bar text {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 500;
}

/* Desktop tooltip — fixed, follows mouse */
.tooltip {
  position: fixed;
  pointer-events: none;
  background: #fff;
  border: 1px solid #e0e0e0;
  box-shadow: 0 6px 24px rgba(0,0,0,0.10);
  padding: 0;
  font-size: 0.8rem;
  line-height: 1.5;
  z-index: 1000;
  width: 240px;
  opacity: 0;
  transition: opacity 0.15s ease;
  overflow: hidden;
}
.tooltip.visible { opacity: 1; }
.tooltip .tt-photo {
  width: 100%;
  height: 160px;
  object-fit: cover;
  display: block;
  background: #f5f5f5;
}
.tooltip .tt-body {
  padding: 10px 14px 12px;
  position: relative;
}
.tooltip .tt-artist {
  font-weight: 700;
  font-size: 0.85rem;
  margin-bottom: 1px;
  color: #111;
}
.tooltip .tt-date {
  color: #666;
  font-size: 0.7rem;
  font-family: 'DM Mono', monospace;
}
.tooltip .tt-venue {
  color: #111;
  font-size: 0.75rem;
  margin-top: -1px;
}
.tooltip .tt-close {
  display: none;
}

/* Mobile tooltip — absolute inside chart-wrap, above bubble */
.mobile-tooltip {
  position: absolute;
  pointer-events: auto;
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 10px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.14);
  padding: 0;
  font-size: 0.8rem;
  line-height: 1.5;
  z-index: 1000;
  width: 220px;
  opacity: 0;
  transition: opacity 0.15s ease;
  overflow: hidden;
  transform: translateX(-50%);
}
.mobile-tooltip.visible { opacity: 1; }
.mobile-tooltip .tt-photo {
  width: 100%;
  height: 130px;
  object-fit: cover;
  display: block;
  background: #f5f5f5;
  border-radius: 10px 10px 0 0;
}
.mobile-tooltip .tt-body {
  padding: 8px 12px 10px;
  position: relative;
}
.mobile-tooltip .tt-artist {
  font-weight: 700;
  font-size: 0.8rem;
  margin-bottom: 1px;
  color: #111;
  padding-right: 24px;
}
.mobile-tooltip .tt-date {
  color: #666;
  font-size: 0.65rem;
  font-family: 'DM Mono', monospace;
}
.mobile-tooltip .tt-venue {
  color: #111;
  font-size: 0.7rem;
  margin-top: -1px;
}
.mobile-tooltip .tt-close {
  position: absolute;
  top: 6px;
  right: 8px;
  width: 24px;
  height: 24px;
  border: none;
  background: none;
  font-size: 1.1rem;
  color: #999;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  line-height: 1;
}
.mobile-tooltip .tt-close:hover { color: #333; }

/* Arrow pointing down from tooltip to bubble */
.mobile-tooltip::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-top: 8px solid #fff;
}

/* Responsive */
@media (max-width: 768px) {
  .header { padding: 1.5rem 0 0.75rem; }
  .header h1 { font-size: 1.75rem; }
  .legend { gap: 0.6rem; }
  .legend-item { font-size: 0.75rem; }
}
@media (max-width: 1024px) and (min-width: 769px) {
  /* iPad tweaks */
  .legend-item { font-size: 0.8rem; }
}
</style>
</head>
<body>

<div class="fixed-top" id="fixed-top">
  <div class="header" id="header">
    <h1>Concert timeline</h1>
  </div>

  <div class="controls" id="controls">
    <div class="legend" id="legend"></div>
  </div>
</div>

<div id="top-spacer" style="height: 160px;"></div>

<div class="chart-wrap" id="chart-wrap">
  <svg id="chart"></svg>
  <div class="mobile-tooltip" id="mobile-tooltip"></div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
(function() {

  const GENRE_COLORS = {
    rock:    '#ff0064',
    blues:   '#0b1d3a',
    jazz:    '#6a00f4',
    soul:    '#1B998B',
    folk:    '#4BB3FD',
  };
  const UNKNOWN_COLOR = '#d1d4db';

  const isMobile = window.innerWidth <= 768;
  const isTablet = window.innerWidth <= 1024 && window.innerWidth > 768;
  const hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  const isTouchDevice = hasTouch || isMobile || isTablet;

  const RADIUS = isMobile ? 11 : (isTablet ? 12 : 14);
  const COLLISION_PADDING = isMobile ? 3 : 4;
  const LEFT_PADDING = isMobile ? 20 : (isTablet ? 40 : 60);

  const tooltip = document.getElementById('tooltip');
  const mobileTooltip = document.getElementById('mobile-tooltip');
  const chartWrap = document.getElementById('chart-wrap');
  const svg = d3.select('#chart');

  let currentActiveNode = null;

  function hideTooltip() {
    tooltip.classList.remove('visible');
    mobileTooltip.classList.remove('visible');
    // Reset any enlarged bubble
    svg.selectAll('.bee-node circle')
      .transition().duration(150)
      .attr('r', RADIUS)
      .attr('stroke-width', 1.5)
      .attr('opacity', 0.88);
    currentActiveNode = null;
  }

  let allEvents = [];
  let activeGenres = new Set();
  let simulation;

  function formatDate(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[m - 1]} ${d}, ${y}`;
  }

  function photoThumb(d) {
    if (d.photo) return `photos/${d.photo}-thumb.jpg`;
    return null;
  }

  async function init() {
    const resp = await fetch('events.json');
    allEvents = await resp.json();

    allEvents.forEach(d => {
      d.parsedDate = new Date(d.date + 'T12:00:00');
    });

    const genreOrder = ['rock', 'blues', 'jazz', 'folk', 'soul'];
    const genresInData = new Set(allEvents.map(d => d.genre).filter(Boolean));
    const genres = genreOrder.filter(g => genresInData.has(g));
    activeGenres = new Set(genres);
    buildLegend(genres);

    render();
  }

  function buildLegend(genres) {
    const container = document.getElementById('legend');
    genres.forEach(g => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.dataset.genre = g;
      item.innerHTML = `<span class="legend-dot" style="background:${GENRE_COLORS[g] || UNKNOWN_COLOR}"></span>${g}`;
      item.addEventListener('click', () => toggleGenre(g, item));
      container.appendChild(item);
    });
  }

  function toggleGenre(genre, el) {
    if (activeGenres.has(genre)) {
      activeGenres.delete(genre);
      el.classList.add('dimmed');
    } else {
      activeGenres.add(genre);
      el.classList.remove('dimmed');
    }
    updateVisibility();
  }

  function updateVisibility() {
    svg.selectAll('.bee-node')
      .transition().duration(300)
      .style('opacity', d => activeGenres.has(d.genre) ? 1 : 0.08);
  }

  function render() {
    const viewportWidth = window.innerWidth;
    const width = isMobile
      ? Math.max(viewportWidth * 6, 2400)
      : isTablet
        ? Math.max(viewportWidth * 3.5, 2400)
        : Math.max(viewportWidth * 2.5, 2800);
    const height = isMobile
      ? Math.max(500, window.innerHeight * 0.75)
      : isTablet
        ? Math.max(500, window.innerHeight * 0.6)
        : Math.max(500, Math.min(700, window.innerHeight * 0.6));
    const margin = { top: 40, right: 60, bottom: 80, left: LEFT_PADDING };

    // Align header and controls with the left margin
    document.getElementById('header').style.paddingLeft = margin.left + 'px';
    document.getElementById('controls').style.paddingLeft = margin.left + 'px';


    svg.attr('width', width).attr('height', height);
    document.querySelector('.chart-wrap').style.minWidth = width + 'px';
    svg.selectAll('*').remove();

    // Time scale — align first year line with left margin
    const dateExtent = d3.extent(allEvents, d => d.parsedDate);
    const startYear = new Date(dateExtent[0].getFullYear(), 0, 1);
    const endDate = d3.timeMonth.offset(dateExtent[1], 6);
    const xScale = d3.scaleTime()
      .domain([startYear, endDate])
      .range([margin.left, width - margin.right]);

    // Generate year ticks
    const firstYear = startYear.getFullYear();
    const endYear = dateExtent[1].getFullYear() + 1;
    const yearDates = [];
    for (let y = firstYear; y <= endYear; y++) {
      yearDates.push(new Date(y, 0, 1));
    }

    // Draw vertical year lines
    const linesGroup = svg.append('g');

    yearDates.forEach(d => {
      const x = xScale(d);
      const year = d.getFullYear();
      const isMajor = year % 5 === 0;

      linesGroup.append('line')
        .attr('x1', x)
        .attr('x2', x)
        .attr('y1', margin.top - 10)
        .attr('y2', height - margin.bottom + 10)
        .attr('stroke', isMajor ? '#ddd' : '#f0f0f0')
        .attr('stroke-width', isMajor ? 1 : 0.5);

      // Year labels at bottom
      if (isMajor || (endYear - firstYear) < 20) {
        linesGroup.append('text')
          .attr('x', x)
          .attr('y', height - margin.bottom + 28)
          .attr('class', `year-label ${isMajor ? 'year-label-major' : ''}`)
          .text(year);
      }
    });

    // ── Location bar ──
    const locations = [
      { label: 'MADISON, WI',       start: new Date(1995, 0, 1),  end: new Date(1997, 7, 1),  color: '#FF0064' },
      { label: 'MISSOULA, MT',      start: new Date(1997, 7, 1),  end: new Date(1999, 5, 1),  color: '#E8850C' },
      { label: 'MINNEAPOLIS, MN',   start: new Date(1999, 5, 1),  end: new Date(2002, 11, 31), color: '#61BCFD' },
      { label: 'LOS ANGELES, CA',   start: new Date(2003, 0, 1),  end: new Date(2005, 9, 1),  color: '#36A599' },
      { label: 'CHICAGO, IL',       start: new Date(2005, 9, 1),  end: new Date(2011, 6, 1),  color: '#283852' },
      { label: 'SAN FRANCISCO, CA', start: new Date(2011, 6, 1),  end: new Date(2013, 7, 31), color: '#D4543A' },
      { label: 'NEW YORK, NY',      start: new Date(2013, 8, 1),  end: new Date(2016, 7, 31), color: '#7C1FF5' },
      { label: 'MELBOURNE, AUS',    start: new Date(2016, 8, 1),  end: new Date(2026, 4, 1),  color: '#2D8A56' },
    ];

    // Location pin icon path (scaled to fit in bar)
    const pinPath = 'M5.76,5.25C5.76,2.35,8.1,0,11,0C13.9,0,16.24,2.35,16.24,5.26C16.24,8.16,13.26,11.57,11.24,13.47C11.1,13.59,10.9,13.59,10.77,13.47C8.74,11.57,5.76,8.09,5.76,5.26ZM11,2.85C9.67,2.85,8.6,3.93,8.6,5.26C8.6,6.58,9.67,7.66,11,7.66C12.33,7.66,13.4,6.59,13.4,5.26C13.4,3.92,12.33,2.85,11,2.85Z';

    const locGroup = svg.append('g').attr('class', 'location-bar');
    const barY = height - margin.bottom + 38;
    const barH = 24;
    const gap = 10;

    locations.forEach((loc, i) => {
      let x1 = Math.max(xScale(loc.start), margin.left);
      let x2 = Math.min(xScale(loc.end), width - margin.right);

      // Add gap between bars (except first)
      if (i > 0) x1 += gap / 2;
      // Add gap after (except last)
      if (i < locations.length - 1) x2 -= gap / 2;

      const w = x2 - x1;
      if (w <= 0) return;

      // Background rect at 10% opacity
      locGroup.append('rect')
        .attr('x', x1)
        .attr('y', barY)
        .attr('width', w)
        .attr('height', barH)
        .attr('rx', 3)
        .attr('fill', loc.color)
        .attr('fill-opacity', 0.1)
        .attr('stroke', 'none');

      // Only show icon + label if bar is wide enough
      if (w > 60) {
        // Location pin icon
        const iconScale = 0.85;
        const iconX = x1 + 8;
        const iconY = barY + (barH - 14 * iconScale) / 2;
        locGroup.append('path')
          .attr('d', pinPath)
          .attr('transform', `translate(${iconX - 5.76 * iconScale}, ${iconY}) scale(${iconScale})`)
          .attr('fill', loc.color);

        // Label text
        locGroup.append('text')
          .attr('x', iconX + 12)
          .attr('y', barY + barH / 2 + 3.5)
          .attr('fill', loc.color)
          .attr('font-family', 'Inter, sans-serif')
          .attr('font-size', '10px')
          .attr('font-weight', '500')
          .text(loc.label);
      }
    });

    // Initialize node positions
    const nodes = allEvents.map((d, i) => ({
      ...d,
      index: i,
      x: xScale(d.parsedDate),
      y: height / 2,
      targetX: xScale(d.parsedDate)
    }));

    // Create node groups
    const nodeGroups = svg.append('g')
      .selectAll('g')
      .data(nodes)
      .enter().append('g')
      .attr('class', 'bee-node')
      .style('cursor', 'pointer');

    // Solid colored circles
    nodeGroups.append('circle')
      .attr('r', RADIUS)
      .attr('fill', d => GENRE_COLORS[d.genre] || UNKNOWN_COLOR)
      .attr('stroke', '#fff')
      .attr('stroke-width', 1.5)
      .attr('opacity', 0.88);

    // ── Tooltip content builder ──
    function tooltipContent(d, withClose) {
      const photoSrc = photoThumb(d);
      const photoHtml = photoSrc
        ? `<img class="tt-photo" src="${photoSrc}" alt="" onerror="this.style.display='none'">`
        : '';
      const closeHtml = withClose
        ? `<button class="tt-close" aria-label="Close">&times;</button>`
        : '';

      return `
        ${photoHtml}
        <div class="tt-body">
          ${closeHtml}
          <div class="tt-artist">${d.artist}</div>
          <div class="tt-venue">${d.venue}, ${d.city}</div>
          <div class="tt-date">${formatDate(d.date)}</div>
        </div>
      `;
    }

    // ── Desktop: hover interactions ──
    if (!isTouchDevice) {
      nodeGroups
        .on('mouseenter', function(event, d) {
          d3.select(this).select('circle')
            .transition().duration(150)
            .attr('r', RADIUS + 3)
            .attr('stroke-width', 2.5)
            .attr('opacity', 1);
          d3.select(this).raise();

          tooltip.innerHTML = tooltipContent(d, false);
          tooltip.classList.add('visible');
        })
        .on('mousemove', function(event) {
          let tx = event.clientX + 16;
          let ty = event.clientY - 16;
          const rect = tooltip.getBoundingClientRect();
          if (tx + 240 > window.innerWidth) tx = event.clientX - 256;
          if (ty + rect.height > window.innerHeight) ty = event.clientY - rect.height - 8;
          if (ty < 8) ty = 8;
          tooltip.style.left = tx + 'px';
          tooltip.style.top = ty + 'px';
        })
        .on('mouseleave', function() {
          d3.select(this).select('circle')
            .transition().duration(150)
            .attr('r', RADIUS)
            .attr('stroke-width', 1.5)
            .attr('opacity', 0.88);
          tooltip.classList.remove('visible');
        });
    }

    // ── Touch devices: tap to show tooltip above bubble ──
    if (isTouchDevice) {
      nodeGroups.on('click', function(event, d) {
        event.stopPropagation();

        // If tapping the same node, dismiss
        if (currentActiveNode === this) {
          hideTooltip();
          return;
        }

        hideTooltip();
        currentActiveNode = this;

        d3.select(this).select('circle')
          .transition().duration(150)
          .attr('r', RADIUS + 3)
          .attr('stroke-width', 2.5)
          .attr('opacity', 1);
        d3.select(this).raise();

        mobileTooltip.innerHTML = tooltipContent(d, true);
        mobileTooltip.classList.add('visible');

        // Position above the bubble, centered on viewport horizontally
        // The tooltip is inside chart-wrap (scrollable), so we use
        // the bubble's SVG x position but adjust to be centered in viewport
        const scrollLeft = chartWrap.parentElement.scrollLeft || window.scrollX || document.documentElement.scrollLeft;
        const viewportCenter = scrollLeft + (window.innerWidth / 2);
        const tooltipTop = d.y - RADIUS - 14; // 14px gap above bubble

        mobileTooltip.style.left = viewportCenter + 'px';
        mobileTooltip.style.top = tooltipTop + 'px';

        // Bind close button
        const closeBtn = mobileTooltip.querySelector('.tt-close');
        if (closeBtn) {
          closeBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            hideTooltip();
          });
        }
      });

      // Tap on empty space dismisses
      document.addEventListener('click', function(e) {
        if (!mobileTooltip.contains(e.target) && !e.target.closest('.bee-node')) {
          hideTooltip();
        }
      });
    }

    // Force simulation
    const centerY = margin.top + (height - margin.top - margin.bottom) / 2;

    simulation = d3.forceSimulation(nodes)
      .force('x', d3.forceX(d => d.targetX).strength(1))
      .force('y', d3.forceY(centerY).strength(0.07))
      .force('collide', d3.forceCollide(RADIUS + COLLISION_PADDING).strength(0.8))
      .alphaDecay(0.02)
      .on('tick', () => {
        nodeGroups.attr('transform', d => {
          d.y = Math.max(margin.top + RADIUS, Math.min(height - margin.bottom - RADIUS, d.y));
          return `translate(${d.x}, ${d.y})`;
        });
      });
  }

  function debounce(fn, ms) {
    let t;
    return function(...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), ms); };
  }

  init();

})();
</script>
</body>
</html>
